name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Fork suites (test/vault/V4VaultHook.t.sol, test/automators/*) need an archive RPC.
  # The default public endpoint rejects archive requests, so CI must provide one.
  MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://eth-mainnet.public.blastapi.io' }}

jobs:
  test:
    name: Foundry Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Test
        run: |
          forge test -vvv
        id: test
